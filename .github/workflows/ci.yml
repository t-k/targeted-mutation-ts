name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    # Workflows start once the repository is public.
    if: github.event.repository.visibility == 'public'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: 24.14.0 }
          - { os: ubuntu-24.04, node: 22.18.0 }
          - { os: ubuntu-24.04-arm, node: 24.14.0 }
          - { os: macos-15, node: 24.14.0 }
          - { os: macos-15-intel, node: 24.14.0 }

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install the pinned Lean toolchain and build the decision executable
        uses: leanprover/lean-action@v1.7.1
        with:
          auto-config: false
          build: true
          use-github-cache: false
          lake-package-directory: proof/lean

      - run: npm ci

      - run: npm test

      - name: Pack and test the installed packages
        run: |
          npm run pack:runtime
          npm run test:package
