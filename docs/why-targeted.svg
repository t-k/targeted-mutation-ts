<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" width="960" height="448" role="img" aria-label="Value-space blind spot and RIPR diagnosis in Targeted Mutation Testing">
  <defs>
    <style>
      .heading { font-family: 'Virgil', 'Segoe Print', 'Bradley Hand', 'Chalkboard SE', cursive, sans-serif; font-size: 16.5px; font-weight: 700; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 700; }
      .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .small { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; }
      .code { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; font-size: 12px; }
      .code-sm { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; font-size: 11px; }
    </style>
    <pattern id="hatch-red" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ffa8a8" stroke-width="2" />
    </pattern>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#6741d9"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#e03131"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d9480f"/>
    </marker>
  </defs>

  <!-- Clean card background for GitHub light & dark themes -->
  <rect x="0" y="0" width="960" height="448" rx="14" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="446" rx="13" fill="none" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- ====================================================================== -->
  <!-- PANEL 1: Value-space blind spot                                        -->
  <!-- ====================================================================== -->
  <rect x="24" y="22" width="912" height="202" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="44" y="48" class="heading" fill="#1e293b">1. Value-space blind spot</text>
  <text x="276" y="48" class="code" fill="#475569">yen &gt;= 5000</text>
  <text x="372" y="48" class="small" fill="#64748b">(tests pass 4800 and 5000)</text>

  <!-- Conventional row -->
  <text x="44" y="88" class="label" fill="#495057">Conventional</text>
  <rect x="164" y="68" width="286" height="32" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text x="307" y="88" text-anchor="middle" class="code-sm" fill="#1b4332">&gt; 5000, &lt; 5000, true / false</text>
  <line x1="450" y1="84" x2="488" y2="84" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="494" y="68" width="128" height="32" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text x="558" y="88" text-anchor="middle" class="label" fill="#2b8a3e">100% killed</text>
  <text x="640" y="88" class="small" fill="#c92a2a" font-weight="700">misses yen &gt;= 4999</text>

  <!-- Targeted row (number line) -->
  <text x="44" y="160" class="label" fill="#5f3dc4">Targeted</text>
  <rect x="164" y="114" width="748" height="94" rx="10" fill="#ffffff" stroke="#d0bfff" stroke-width="1.4"/>

  <!-- Unpinned interval [4801..4999] -->
  <rect x="278" y="148" width="388" height="22" rx="4" fill="#fff5f5" stroke="#ffa8a8" stroke-width="1.2"/>
  <rect x="278" y="148" width="388" height="22" rx="4" fill="url(#hatch-red)" opacity="0.7"/>
  <text x="472" y="139" text-anchor="middle" class="small" fill="#c92a2a" font-weight="700">unpinned thresholds [4801 .. 4999]</text>

  <!-- Axis -->
  <line x1="196" y1="159" x2="884" y2="159" stroke="#495057" stroke-width="1.8" marker-end="url(#arrow-gray)"/>

  <!-- 4800 -->
  <circle cx="258" cy="159" r="6" fill="#1971c2" stroke="#ffffff" stroke-width="2"/>
  <text x="258" y="136" text-anchor="middle" class="small" fill="#1864ab">false</text>
  <text x="258" y="185" text-anchor="middle" class="code" fill="#1864ab">4800</text>

  <!-- 4999 -->
  <polygon points="666,151 674,159 666,167 658,159" fill="#6741d9" stroke="#ffffff" stroke-width="1.5"/>
  <text x="666" y="185" text-anchor="middle" class="code" fill="#5f3dc4" font-weight="700">4999</text>
  <text x="666" y="200" text-anchor="middle" class="code-sm" fill="#5f3dc4">synthesizes yen &gt;= 4999 (1 witness closes 4801..4999)</text>

  <!-- 5000 -->
  <circle cx="766" cy="159" r="6" fill="#2f9e44" stroke="#ffffff" stroke-width="2"/>
  <text x="766" y="136" text-anchor="middle" class="small" fill="#2b8a3e">true</text>
  <text x="766" y="185" text-anchor="middle" class="code" fill="#2b8a3e">5000</text>

  <!-- ====================================================================== -->
  <!-- PANEL 2: RIPR diagnosis                                                -->
  <!-- ====================================================================== -->
  <rect x="24" y="240" width="912" height="186" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="44" y="266" class="heading" fill="#1e293b">2. RIPR diagnosis</text>
  <text x="202" y="266" class="small" fill="#64748b">why a mutant survived</text>

  <!-- Conventional row -->
  <text x="44" y="305" class="label" fill="#495057">Conventional</text>
  <rect x="164" y="284" width="92" height="34" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1.4"/>
  <text x="210" y="305" text-anchor="middle" class="body" fill="#495057">Reach</text>
  <line x1="256" y1="301" x2="292" y2="301" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="298" y="284" width="280" height="34" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="438" y="305" text-anchor="middle" class="body" fill="#64748b">Infect -&gt; Propagate -&gt; Reveal (black box)</text>
  <line x1="578" y1="301" x2="618" y2="301" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="624" y="284" width="288" height="34" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5"/>
  <text x="768" y="305" text-anchor="middle" class="code" fill="#495057"><tspan font-weight="700">survived</tspan>  (manual triage)</text>

  <!-- Targeted row -->
  <text x="44" y="376" class="label" fill="#5f3dc4">Targeted</text>
  <rect x="164" y="355" width="92" height="34" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text x="210" y="376" text-anchor="middle" class="body" fill="#1864ab">Reach</text>
  <line x1="256" y1="372" x2="292" y2="372" stroke="#6741d9" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <rect x="298" y="350" width="144" height="44" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.6"/>
  <text x="370" y="369" text-anchor="middle" class="label" fill="#5f3dc4">Operand Probe</text>
  <text x="370" y="385" text-anchor="middle" class="small" fill="#3b2c68">Infect observed?</text>

  <!-- Upper branch: INPUT GAP -->
  <path d="M 442 362 L 472 362 L 472 348 L 618 348" fill="none" stroke="#e03131" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <text x="545" y="342" text-anchor="middle" class="small" fill="#c92a2a" font-weight="700">No (agreed)</text>
  <rect x="624" y="331" width="288" height="34" rx="8" fill="#fff5f5" stroke="#e03131" stroke-width="1.5"/>
  <text x="768" y="352" text-anchor="middle" class="body" fill="#691b1b"><tspan class="label" fill="#c92a2a">INPUT GAP</tspan>  · exact missing input</text>

  <!-- Lower branch: ASSERTION GAP -->
  <path d="M 442 382 L 472 382 L 472 396 L 618 396" fill="none" stroke="#d9480f" stroke-width="1.6" marker-end="url(#arrow-orange)"/>
  <text x="545" y="390" text-anchor="middle" class="small" fill="#d9480f" font-weight="700">Yes in T, passed</text>
  <rect x="624" y="379" width="288" height="34" rx="8" fill="#fff4e6" stroke="#d9480f" stroke-width="1.5"/>
  <text x="768" y="400" text-anchor="middle" class="body" fill="#6e2b07"><tspan class="label" fill="#d9480f">ASSERTION GAP</tspan>  · weak test T</text>
</svg>
