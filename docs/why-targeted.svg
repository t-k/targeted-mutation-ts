<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 676" width="1120" height="676" role="img" aria-label="Why Targeted Mutation Testing: value-space blind spots and RIPR diagnosis">
  <defs>
    <style>
      .title { font-family: 'Virgil', 'Segoe Print', 'Bradley Hand', 'Chalkboard SE', cursive, sans-serif; font-size: 24px; font-weight: 700; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; }
      .heading { font-family: 'Virgil', 'Segoe Print', 'Bradley Hand', 'Chalkboard SE', cursive, sans-serif; font-size: 16.5px; font-weight: 700; }
      .subhead { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 700; }
      .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .small { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; }
      .code { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; font-size: 11.5px; }
      .code-sm { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; font-size: 10.8px; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 700; }
    </style>
    <pattern id="hatch-red" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ffa8a8" stroke-width="2" />
    </pattern>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#6741d9"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#e03131"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d9480f"/>
    </marker>
  </defs>

  <!-- Clean card background for both GitHub light and dark themes -->
  <rect x="0" y="0" width="1120" height="676" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="1118" height="674" rx="15" fill="none" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="40" class="title" fill="#1e293b">Why Targeted Mutation Testing?</text>
  <text x="36" y="62" class="subtitle" fill="#64748b">Runtime operand observations close value-space blind spots and separate missing inputs from weak assertions</text>

  <!-- ====================================================================== -->
  <!-- PANEL 1: Value-space blind spots                                       -->
  <!-- ====================================================================== -->
  <rect x="36" y="84" width="1048" height="292" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="56" y="112" class="heading" fill="#1e293b">1. Value-space blind spots: syntactic templates vs. observation-guided synthesis</text>
  <rect x="56" y="124" width="1008" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="68" y="142" class="code" fill="#334155">const isFreeShipping = (yen: number) =&gt; yen &gt;= 5000;   // baseline tests observe yen = 4800 (false) and yen = 5000 (true)</text>

  <!-- Row 1A: Conventional -->
  <rect x="56" y="166" width="184" height="54" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="148" y="189" text-anchor="middle" class="subhead" fill="#343a40">Conventional</text>
  <text x="148" y="207" text-anchor="middle" class="small" fill="#64748b">syntax templates only</text>

  <!-- Conventional mutants -->
  <rect x="256" y="166" width="160" height="54" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="336" y="188" text-anchor="middle" class="code" fill="#1b4332">yen &gt; 5000</text>
  <text x="336" y="207" text-anchor="middle" class="small" fill="#2b8a3e">killed by 5000</text>

  <rect x="428" y="166" width="160" height="54" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="508" y="188" text-anchor="middle" class="code" fill="#1b4332">yen &lt; 5000</text>
  <text x="508" y="207" text-anchor="middle" class="small" fill="#2b8a3e">killed by 4800, 5000</text>

  <rect x="600" y="166" width="214" height="54" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="707" y="188" text-anchor="middle" class="code" fill="#1b4332">true / false / undefined</text>
  <text x="707" y="207" text-anchor="middle" class="small" fill="#2b8a3e">all killed</text>

  <!-- Verdict badge -->
  <rect x="830" y="166" width="234" height="54" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="947" y="188" text-anchor="middle" class="badge" fill="#2b8a3e">Reports 100% killed</text>
  <text x="947" y="207" text-anchor="middle" class="small" fill="#c92a2a">Blind spot: never tries yen &gt;= 4999</text>

  <!-- Row 1B: Targeted (Number Line) -->
  <rect x="56" y="242" width="184" height="114" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.7"/>
  <text x="148" y="276" text-anchor="middle" class="subhead" fill="#5f3dc4">Targeted</text>
  <text x="148" y="296" text-anchor="middle" class="small" fill="#3b2c68">computes feasible</text>
  <text x="148" y="312" text-anchor="middle" class="small" fill="#3b2c68">threshold interval</text>
  <text x="148" y="328" text-anchor="middle" class="code-sm" fill="#5f3dc4">via Lean 4</text>

  <!-- Number line card -->
  <rect x="256" y="236" width="808" height="126" rx="10" fill="#ffffff" stroke="#d0bfff" stroke-width="1.5"/>

  <!-- Feasible unpinned region [4801..4999] -->
  <rect x="374" y="274" width="424" height="24" rx="4" fill="#fff5f5" stroke="#ffa8a8" stroke-width="1.2"/>
  <rect x="374" y="274" width="424" height="24" rx="4" fill="url(#hatch-red)" opacity="0.7"/>
  <text x="586" y="264" text-anchor="middle" class="badge" fill="#c92a2a">Unpinned feasible thresholds: [4801 .. 4999]</text>

  <!-- Main axis -->
  <line x1="286" y1="286" x2="1032" y2="286" stroke="#495057" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Tick: 4800 (observed false) -->
  <circle cx="352" cy="286" r="6.5" fill="#1971c2" stroke="#ffffff" stroke-width="2"/>
  <text x="352" y="256" text-anchor="middle" class="small" fill="#1864ab">observed: false</text>
  <text x="352" y="312" text-anchor="middle" class="code" fill="#1864ab">4800</text>

  <!-- Tick: 4999 (nearest undistinguished + witness) -->
  <polygon points="798,278 806,286 798,294 790,286" fill="#6741d9" stroke="#ffffff" stroke-width="1.5"/>
  <text x="798" y="312" text-anchor="middle" class="code" fill="#5f3dc4" font-weight="700">4999</text>

  <!-- Callout from 4999 -->
  <line x1="798" y1="318" x2="798" y2="332" stroke="#6741d9" stroke-width="1.6"/>
  <rect x="406" y="330" width="636" height="24" rx="6" fill="#f3f0ff" stroke="#b197fc" stroke-width="1.2"/>
  <text x="724" y="346" text-anchor="middle" class="code-sm" fill="#3b2c68">Synthesized edit: yen &gt;= 4999  -&gt;  1 witness (4999) kills every wrong threshold in 4801..4999</text>

  <!-- Tick: 5000 (observed true) -->
  <circle cx="888" cy="286" r="6.5" fill="#2f9e44" stroke="#ffffff" stroke-width="2"/>
  <text x="888" y="256" text-anchor="middle" class="small" fill="#2b8a3e">observed: true</text>
  <text x="888" y="312" text-anchor="middle" class="code" fill="#2b8a3e">5000</text>

  <text x="996" y="306" text-anchor="middle" class="small" fill="#868e96">yen</text>

  <!-- ====================================================================== -->
  <!-- PANEL 2: RIPR diagnosis                                                -->
  <!-- ====================================================================== -->
  <rect x="36" y="394" width="1048" height="258" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="56" y="422" class="heading" fill="#1e293b">2. RIPR diagnosis: why a mutant survived (without manual triage)</text>

  <!-- Column headers for RIPR stages -->
  <text x="294" y="446" text-anchor="middle" class="small" fill="#64748b" font-weight="700">REACH</text>
  <text x="466" y="446" text-anchor="middle" class="small" fill="#64748b" font-weight="700">INFECT (state diverges?)</text>
  <text x="646" y="446" text-anchor="middle" class="small" fill="#64748b" font-weight="700">PROPAGATE -&gt; REVEAL</text>
  <text x="900" y="446" text-anchor="middle" class="small" fill="#64748b" font-weight="700">REPORTED VERDICT</text>

  <!-- Row 2A: Conventional -->
  <rect x="56" y="458" width="166" height="54" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="139" y="489" text-anchor="middle" class="subhead" fill="#343a40">Conventional</text>

  <rect x="240" y="464" width="108" height="42" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1.4"/>
  <text x="294" y="489" text-anchor="middle" class="body" fill="#495057">Covered</text>

  <line x1="348" y1="485" x2="378" y2="485" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-gray)"/>

  <rect x="382" y="460" width="322" height="50" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="543" y="482" text-anchor="middle" class="body" fill="#495057">Unobserved black box</text>
  <text x="543" y="499" text-anchor="middle" class="small" fill="#868e96">Did operands diverge? Did assertions check it?</text>

  <line x1="704" y1="485" x2="736" y2="485" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-gray)"/>

  <rect x="740" y="458" width="324" height="54" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6"/>
  <text x="902" y="481" text-anchor="middle" class="code" fill="#495057" font-weight="700">survived</text>
  <text x="902" y="500" text-anchor="middle" class="small" fill="#64748b">Ambiguous: developer must inspect tests by hand</text>

  <!-- Row 2B: Targeted -->
  <rect x="56" y="530" width="166" height="104" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.7"/>
  <text x="139" y="576" text-anchor="middle" class="subhead" fill="#5f3dc4">Targeted</text>
  <text x="139" y="595" text-anchor="middle" class="small" fill="#3b2c68">value probes active</text>

  <rect x="240" y="561" width="108" height="42" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="294" y="586" text-anchor="middle" class="body" fill="#1864ab">Covered</text>

  <line x1="348" y1="582" x2="378" y2="582" stroke="#6741d9" stroke-width="1.6" marker-end="url(#arrow-purple)"/>

  <rect x="382" y="548" width="168" height="68" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.7"/>
  <text x="466" y="574" text-anchor="middle" class="subhead" fill="#5f3dc4">Operand Probe</text>
  <text x="466" y="593" text-anchor="middle" class="small" fill="#3b2c68">Did edit change</text>
  <text x="466" y="608" text-anchor="middle" class="small" fill="#3b2c68">expression value?</text>

  <!-- Branch top: No infection -> INPUT GAP -->
  <path d="M 550 566 L 580 566 L 580 554 L 736 554" fill="none" stroke="#e03131" stroke-width="1.7" marker-end="url(#arrow-red)"/>
  <rect x="588" y="534" width="138" height="18" rx="4" fill="#f8fafc"/>
  <text x="657" y="547" text-anchor="middle" class="small" fill="#c92a2a" font-weight="700">No (agreed on all hits)</text>

  <rect x="740" y="528" width="324" height="50" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/>
  <text x="902" y="549" text-anchor="middle" class="badge" fill="#c92a2a">INPUT GAP</text>
  <text x="902" y="567" text-anchor="middle" class="small" fill="#691b1b">Names exact missing input &amp; suggested test</text>

  <!-- Branch bottom: Infected, not revealed -> ASSERTION GAP -->
  <path d="M 550 598 L 580 598 L 580 612 L 736 612" fill="none" stroke="#d9480f" stroke-width="1.7" marker-end="url(#arrow-orange)"/>
  <rect x="588" y="592" width="138" height="18" rx="4" fill="#f8fafc"/>
  <text x="657" y="605" text-anchor="middle" class="small" fill="#d9480f" font-weight="700">Yes in T, yet T passed</text>

  <rect x="740" y="586" width="324" height="50" rx="10" fill="#fff4e6" stroke="#d9480f" stroke-width="1.6"/>
  <text x="902" y="607" text-anchor="middle" class="badge" fill="#d9480f">ASSERTION GAP</text>
  <text x="902" y="625" text-anchor="middle" class="small" fill="#6e2b07">Names test T, operands &amp; --suggest-assertions</text>
</svg>
